; PlatformIO Project Configuration File
; ESP-WROOM-32 + ILI9341 2.4" TFT (no touch) + 5-way tactile switch

[env:esp-wroom32-ili9341]
board = esp32
monitor_speed = 115200
upload_port = COM3
upload_speed = 115200
upload_flags = --no-stub
board_build.partitions = custom_4Mb_full.csv
build_src_filter =
	${env.build_src_filter}
	+<../boards/esp-wroom32-ili9341>
	-<modules/gps/**>
	-<core/menu_items/GpsMenu.cpp>
	-<core/menu_items/RFIDMenu.cpp>
	-<core/menu_items/EthernetMenu.cpp>
	-<modules/fm/**>
	-<core/menu_items/FMMenu.cpp>
	-<core/serial_commands/rfid_commands.cpp>
build_flags =
	${env.build_flags}
	-Iboards/esp-wroom32-ili9341

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=0  ; Arduino core log verbosity (0=none .. 5=verbose)

	; ==================== Feature gates ====================

	-DDISABLE_GPS=1
	-DDISABLE_ETHERNET=1
	-DDISABLE_RFID=1
	-DDISABLE_FM=1
	-DHAS_6_BUTTONS
	-DALLOW_ALL_GPIO_FOR_IR_RF=1
	-DANALOG_BAT_PIN=36
	-D USE_HSPI_PORT=1

	; ==================== Library Flags ====================

	; TFT_eSPI Setup for ILI9341 2.4" display
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=16
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000

	; ==================== Environment Flags ====================

	-DDEVICE_NAME='"ESP32-ILI9341"'
	-DBTN_ALIAS='"OK"'

	-DROTATION=1

	-DHAS_RGB_LED=0
	-DRGB_LED=26
	-DLED_TYPE=WS2812B
	-DLED_ORDER=GRB
	-DLED_COUNT=1
	-DLED_COLOR_STEP=5

lib_deps =
	${env.lib_deps}
lib_ignore =
	TinyGPSPlus
